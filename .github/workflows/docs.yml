name: Wiki

# Builds the Doxygen wiki (docs/) and publishes it to GitHub Pages.
# Site: https://<owner>.github.io/njin/
#
# One-time setup in the repository: Settings > Pages > Build and deployment >
# Source: "GitHub Actions". Pages on a private repository needs a paid plan.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/engine/api/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still queued, but never
# cancels a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The version the wiki is written against. The header template and the
  # doxygen-awesome theme in docs/ are tied to it, so it is pinned rather than
  # taken from apt, which is far behind.
  DOXYGEN_VERSION: 1.18.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          curl -fsSL -o doxygen.tar.gz \
            "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tar -xzf doxygen.tar.gz
          echo "$PWD/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build the wiki
        working-directory: docs
        run: |
          doxygen --version
          doxygen Doxyfile
          doxygen Doxyfile.en

      # Doxygen writes its warnings to a file and exits 0. Surface them on the
      # run so a broken @ref or an undocumented parameter is not missed.
      - name: Report Doxygen warnings
        working-directory: docs
        run: |
          for log in doxygen_warnings.txt doxygen_warnings_en.txt; do
            if [ -s "$log" ]; then
              echo "::warning title=Doxygen::$(wc -l < "$log") warning(s) in $log"
              cat "$log"
            else
              echo "No Doxygen warnings in $log."
            fi
          done

      # The English wiki is a translation of the Vietnamese one. Report copies
      # that are missing, older than their source, or whose code has drifted.
      - name: Check the translations
        run: |
          if ! python3 docs/i18n.py check > i18n.txt; then
            echo "::warning title=Translations::$(grep -vc '^[0-9]* problem' i18n.txt) file(s) out of step"
          fi
          cat i18n.txt

      - name: Check the site was generated
        run: |
          test -s docs/html/index.html
          test -s docs/html/en/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
