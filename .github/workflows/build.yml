name: Build

# Builds every target on Windows (MSVC) and Linux (GCC), so a change that only
# compiles with one toolchain is caught. The developer's own setup is GCC from
# w64devkit on Windows, which this does not cover.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build and package an external game
        shell: pwsh
        run: >-
          cmake "-DNJIN_ROOT=$env:GITHUB_WORKSPACE"
          "-DNJIN_PREBUILT=$env:GITHUB_WORKSPACE/build"
          "-DTEST_ROOT=$env:RUNNER_TEMP/njin-standalone"
          -P cmake/check_standalone.cmake

  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # raylib's desktop backend (GLFW) and the inspector (ImGui) need the X11
      # and OpenGL development headers.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Build and package an external game
        run: >-
          cmake -DNJIN_ROOT="$GITHUB_WORKSPACE"
          -DNJIN_PREBUILT="$GITHUB_WORKSPACE/build-release"
          -DTEST_ROOT="$RUNNER_TEMP/njin-standalone"
          -P cmake/check_standalone.cmake
